<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Us - Traveller's Lounge</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="public/css/main.css">

</head>

<body>

    <!-- Navigation -->
    <nav>

        <h1 class="topmenu">Traveller's Lounge</h1>

        <ul>
            <li>
                <a class="topmenu" href="travel_recommendation.html">
                    Home
                </a>
            </li>

            <li>
                <a class="topmenu" href="about.html">
                    About Us
                </a>
            </li>

            <li>
                <a class="topmenu" href="contact.html">
                    Contact Us
                </a>
            </li>
        </ul>

    </nav>


    <!-- Social Media -->
    <div class="leftside">
        <ul>
            <li><i class="fa fa-facebook-official"></i></li>
            <li><i class="fa fa-linkedin-square"></i></li>
            <li><i class="fa fa-instagram"></i></li>
            <li><i class="fa fa-twitter-square"></i></li>
        </ul>
    </div>


    <!-- Contact Form -->
    <div class="upper-main">

        <div class="contact-form">

            <div class="flex_center">

                <form id="contactForm">

                    <h1>Contact Us</h1>

                    <div class="form-element">
                        <input
                            type="text"
                            id="name"
                            placeholder="Name"
                        >
                    </div>

                    <div class="form-element">
                        <input
                            type="email"
                            id="email"
                            placeholder="Your Email"
                            required
                        >
                    </div>

                    <div class="form-element">
                        <textarea
                            id="new_message"
                            rows="10"
                            placeholder="Message"
                            required
                        ></textarea>
                    </div>

                    <div class="form-element">
                        <button type="submit" id="contact_btn">
                            Submit Message
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="public/js/script.js"></script>

</body>
</html>
